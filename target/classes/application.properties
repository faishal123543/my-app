# ===============================
# DATABASE CONFIG (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/loan_management
spring.datasource.username=postgres
spring.datasource.password=1234567890

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVER
# ===============================
server.port=8082

# ===============================
# CORS
# ===============================
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:4202
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=./uploads/profile-photos

# ===============================
# SMS / OTP CONFIG
# ===============================
# Set to true and fill in real Twilio credentials below to enable live SMS.
# Keep false during development — OTP will be printed to the server console.
twilio.enabled=false

# --- Twilio credentials (only required when twilio.enabled=true) ---
# twilio.account-sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# twilio.auth-token=your_auth_token_here
# twilio.from-number=+12025551234
